name: CarePyre CI

on:
  push:
  pull_request:

# contents: write -- needed by the release job below (creating a git tag +
# a GitHub Release), same real reasoning PARENA's own ci.yml already
# documents. The build job itself only ever reads; scoped down explicitly.
permissions:
  contents: write

jobs:
  sip-jni-proof:
    name: SIP JNI proof (Bazel — build libcarepyre_sip.so, run the real Java smoke test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # CP-OPS-1244 ("CP SIP PHONE SHOULD USE BAZEL") -- real Bazel build, replacing the raw
      # gcc/javac/java invocation this job used before. Same real hermetic JDK 21
      # (@bazel_tools//tools/jdk:jni + .bazelrc's own --java_runtime_version=remotejdk_21,
      # verified live against this exact repo before adopting) resolves jni.h/jni_md.h -- no
      # actions/setup-java step needed any more, Bazel fetches its own.
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # parena_runtime.h unconditionally includes <SDL2/SDL.h>/<SDL2/SDL_ttf.h>
      # (stdlib/sdl2.prn is "built in, same tier as core" per PARENA's own
      # STDLIB.md), so ANY build of this runtime needs these dev headers,
      # not just ones that happen to call into sdl2.prn -- same real gotcha
      # PARENA's own ci.yml already documents and fixes the same way. Bazel's
      # autoconfigured local cc toolchain falls through to /usr/include for
      # this, same as PARENA's own Bazel setup already relies on.
      - name: Install SDL2 + SDL2_ttf dev headers (CI runner -- apt is normal here)
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev

      - name: Build libcarepyre_sip.so (bazel build)
        run: bazel build //native/sip-jni-proof:libcarepyre_sip.so

      # SipNative.main() builds a real SIP REGISTER through the JNI bridge
      # and asserts its RFC 3261 shape -- this IS the real Phase 1 proof
      # (SIP_PHONE_ANDROID_NORTHSTAR.md), not just "did it compile."
      - name: Run the real JNI smoke test (bazel test)
        run: bazel test //native/sip-jni-proof:jni_smoke_test --test_output=all

      # CP-SIP-123 ("CarePyre SIP phone should have artifacts") -- the real
      # build output, downloadable from the run's own Summary page without
      # needing to rebuild locally. Only after the smoke test above has
      # already proven the library actually works, not just that it linked.
      - name: Upload libcarepyre_sip.so
        uses: actions/upload-artifact@v4
        with:
          name: libcarepyre_sip-${{ github.run_number }}-${{ github.sha }}
          path: bazel-bin/native/sip-jni-proof/libcarepyre_sip.so
          if-no-files-found: error

  # CP-SIP-9911 ("Android APK should be in releases") -- a real, minimal, installable Android
  # app (android/), NOT yet embedding native/sip-jni-proof's own libcarepyre_sip.so. Real,
  # honest reason found while scoping this card: parena_runtime.h unconditionally includes
  # SDL2 headers, and the NDK has no "apt-get install libsdl2-dev" equivalent -- cross-compiling
  # it for a real Android ABI needs its own real Android-targeted SDL2 build, a genuinely
  # separate, harder problem than the desktop JNI proof solved. See
  # docs/SIP_PHONE_ANDROID_NORTHSTAR.md's own Phase 5 for the real, not-yet-solved gap this
  # leaves; this job ships the real Android scaffold that's buildable and installable today.
  #
  # No explicit Android SDK install step -- GitHub's own ubuntu-latest runners ship with a
  # pre-installed SDK (ANDROID_HOME already set) specifically because Android CI is one of the
  # most common uses of the platform; the Android Gradle Plugin finds it automatically.
  android-app:
    name: Android APK (real, minimal scaffold -- no native SIP core wired in yet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload CarePyreSipPhone-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: CarePyreSipPhone-debug-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # CP-SIP-124 ("CarePyre SIP phone should have releases") -- same real
  # auto-minor-version-bump-on-green-main-build pattern PARENA's own ci.yml
  # already established (founder real-time, 2026-08-21: "whenever a build
  # passes release it as a minor version"): every green build on main cuts
  # a real GitHub Release with libcarepyre_sip.so attached. Gated to
  # push-to-main only, needs the build job to have already passed.
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [sip-jni-proof, android-app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 -- this job needs the full tag history to find the
      # current version; actions/checkout's own default is a shallow clone
      # that doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download libcarepyre_sip.so
        uses: actions/download-artifact@v4
        with:
          name: libcarepyre_sip-${{ github.run_number }}-${{ github.sha }}
          path: dist

      - name: Download CarePyreSipPhone-debug.apk
        uses: actions/download-artifact@v4
        with:
          name: CarePyreSipPhone-debug-${{ github.run_number }}-${{ github.sha }}
          path: dist

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            dist/libcarepyre_sip.so \
            dist/app-debug.apk \
            --title "$NEXT_VERSION" \
            --generate-notes
