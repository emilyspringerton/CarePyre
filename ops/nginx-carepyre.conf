# Live version, post-certbot: this reflects /etc/nginx/sites-available/carepyre
# as it actually stands on the box (certbot's --nginx plugin rewrote it to add
# the SSL server block + the port-80-to-443 redirect on 2026-08-10). The
# location /api/ block was added by hand (sudo-queue/14-carepyre-api-proxy.sh)
# to reverse-proxy the contact form's fetch() calls to IDUNA on :8080 —
# identical pattern to okemily.com's own /api/ proxy (see OKEMILY's nginx
# conf), so the browser-side JS can use a same-origin relative path with no
# CORS involved at all.
server {
    server_name carepyre.org www.carepyre.org;

    root /var/www/carepyre;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /ws -- real WebSocket proxy for the in-browser CarePyre SIP Phone (webphone.html, JsSIP
    # over wss://). Forwards to Asterisk's own built-in HTTP/WS server, bound loopback-only
    # (127.0.0.1:8088, see sudo-queue/62) -- this nginx block is the ONLY real public path in,
    # TLS terminated here with the box's existing Let's Encrypt cert, same as every other
    # location in this file.
    #
    # Real, found-live bug, 2026-09-06: sudo-queue/63-nginx-wss-proxy-for-webphone.sh originally
    # added this block ONLY to the live /etc/nginx/sites-available/carepyre file, never back into
    # this repo's own copy -- so the next time sudo-queue/51 (console deploy) blindly `cp`'d this
    # file over the live one, it silently erased the webphone's only public entry point, and the
    # embedded Web Phone hung on "Connecting..." forever with no error. This block is now
    # checked in for real so that regression can't happen again.
    location /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # /console-api/ -- CPP-124433/CPP-2144333 (CarePyre Console). Proxies to a real,
    # separately-running IDUNA_PRO instance (its own binary, own port, own SQLite DB --
    # IDUNA_PRO's own source is untouched, see docs/CAREPYRE_CONSOLE_NORTHSTAR.md). The
    # trailing slash on proxy_pass strips the /console-api prefix, so
    # /console-api/api/v1/auth/local -> IDUNA_PRO's own real /api/v1/auth/local -- same-origin
    # from console.html's own fetch() calls, no CORS needed anywhere.
    location /console-api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/carepyre.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/carepyre.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.carepyre.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = carepyre.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name carepyre.org www.carepyre.org;
    return 404; # managed by Certbot
}
