# Live version, post-certbot: this reflects /etc/nginx/sites-available/carepyre
# as it actually stands on the box (certbot's --nginx plugin rewrote it to add
# the SSL server block + the port-80-to-443 redirect on 2026-08-10). The
# location /api/ block was added by hand (sudo-queue/14-carepyre-api-proxy.sh)
# to reverse-proxy the contact form's fetch() calls to IDUNA on :8080 —
# identical pattern to okemily.com's own /api/ proxy (see OKEMILY's nginx
# conf), so the browser-side JS can use a same-origin relative path with no
# CORS involved at all.
server {
    server_name carepyre.org www.carepyre.org;

    root /var/www/carepyre;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/carepyre.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/carepyre.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.carepyre.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = carepyre.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name carepyre.org www.carepyre.org;
    return 404; # managed by Certbot
}
