<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CarePyre Web Phone</title>
<!--
  webphone.html -- a real, in-browser SIP phone for CarePyre's own PBX, using JsSIP (a real,
  established WebRTC SIP library, MIT licensed, https://jssip.net) over wss://. Founder
  real-time pivot: the native Android app's own real SIP/RTP signaling (see
  docs/SIP_PHONE_ANDROID_NORTHSTAR.md Phase 2) is correct and was live-verified against this
  same Asterisk box, but its raw UDP transport is blocked somewhere between a real phone on
  mobile 5G and this server by a firewall outside this box's own OS (confirmed clean via
  sudo-queue/61 -- ufw inactive, iptables/nftables have no matching rule). This page sidesteps
  that whole class of problem: wss:// rides over the same TLS/443 path every browser already
  uses for HTTPS, which no mobile carrier or router firewall blocks.

  Registers as extension 1000web (a real, separate PJSIP endpoint from the native app's own
  extension 1000 -- see PARENA/ops/asterisk/pjsip_carepyre_webphone.conf's own header comment
  for why they're kept separate: webrtc=yes forces DTLS-SRTP/ICE that the native app's own plain
  RTP does not speak). Asterisk's own dialplan (extensions_carepyre.conf) rings both extensions
  on an inbound Twilio call -- whichever answers first wins.
-->
<style>
  :root {
    --white: #FFFFFF;
    --pale-blue: #EAF6FB;
    --sky: #3FA9DC;
    --sky-dark: #1D7EA6;
    --cyan: #22D3EE;
    --orange: #FF8A3D;
    --text: #1A2733;
    --text-muted: #5B6B76;
    --border: #D6E8F0;
    --danger: #E5484D;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--pale-blue);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap {
    max-width: 420px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--white);
    box-shadow: 0 0 40px rgba(29,126,166,0.08);
  }
  header {
    padding: 1.4rem 1.4rem 1rem; border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 1.15rem; color: var(--sky-dark); }
  header p { margin: 0.25rem 0 0; font-size: 0.8rem; color: var(--text-muted); }
  main { flex: 1; padding: 1.4rem; display: flex; flex-direction: column; gap: 1rem; }
  .screen { display: none; flex-direction: column; gap: 1rem; flex: 1; }
  .screen.active { display: flex; }
  label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 0.3rem; }
  input[type=text], input[type=password], input[type=tel] {
    width: 100%; padding: 0.65rem 0.8rem; border: 1px solid var(--border); border-radius: 10px;
    font-size: 0.98rem; color: var(--text); background: var(--pale-blue);
  }
  .field { margin-bottom: 0.6rem; }
  button {
    font-family: inherit; cursor: pointer; border: none;
  }
  .btn-primary {
    background: var(--sky); color: var(--white); padding: 0.75rem 1rem;
    border-radius: 12px; font-size: 1rem; font-weight: 600; width: 100%;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-secondary {
    background: var(--pale-blue); color: var(--sky-dark); padding: 0.6rem 1rem;
    border-radius: 10px; font-size: 0.9rem; font-weight: 600; border: 1px solid var(--border);
  }
  #status-line {
    font-size: 0.82rem; color: var(--text-muted); min-height: 1.2em;
  }
  #status-line.error { color: var(--danger); }
  #status-line.ok { color: var(--sky-dark); }

  .call-status { text-align: center; font-size: 1rem; color: var(--text-muted); margin-top: 1rem; }
  .caller { text-align: center; margin: 0.5rem 0 1rem; }
  .caller-avatar {
    width: 4.5rem; height: 4.5rem; border-radius: 999px; background: var(--sky);
    color: var(--white); font-size: 1.6rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 0.6rem;
  }
  .caller-number { font-size: 1.05rem; font-weight: 600; }

  .call-actions { display: flex; gap: 2.2rem; justify-content: center; margin: 1.4rem 0; }
  .round-btn {
    width: 3.8rem; height: 3.8rem; border-radius: 999px; color: #fff; font-size: 1.3rem;
  }
  .round-btn.accept { background: #2FB380; }
  .round-btn.decline { background: var(--danger); }
  .round-btn-col { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
  .round-btn-label { font-size: 0.7rem; color: var(--text-muted); }

  .keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin: 0.6rem 0;
  }
  .keypad button {
    background: var(--pale-blue); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.7rem 0; font-size: 1.15rem; color: var(--text);
  }
  .keypad button:active { background: var(--border); }

  nav.tabs { display: flex; border-top: 1px solid var(--border); }
  nav.tabs button {
    flex: 1; background: var(--white); padding: 0.8rem 0; font-size: 0.85rem;
    color: var(--text-muted); border-top: 3px solid transparent;
  }
  nav.tabs button.active { color: var(--sky-dark); border-top-color: var(--sky); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CarePyre Web Phone</h1>
    <p>Real SIP/WebRTC calling, no app install -- extension 1000web</p>
  </header>

  <main>
    <!-- CONFIG SCREEN -->
    <div class="screen active" id="screen-config">
      <div class="field">
        <label for="cfg-extension">Extension</label>
        <input type="text" id="cfg-extension" value="1000web" />
      </div>
      <div class="field">
        <label for="cfg-password">Password</label>
        <input type="password" id="cfg-password" autocomplete="off" />
      </div>
      <div class="field">
        <label for="cfg-domain">SIP domain (usually carepyre.org)</label>
        <input type="text" id="cfg-domain" value="carepyre.org" />
      </div>
      <button class="btn-primary" id="btn-register">Register</button>
      <div id="status-line"></div>
    </div>

    <!-- DIAL SCREEN -->
    <div class="screen" id="screen-dial">
      <div class="field">
        <label for="dial-number">Number to call</label>
        <input type="tel" id="dial-number" placeholder="+15555550123" />
      </div>
      <button class="btn-primary" id="btn-call">Call</button>
      <div id="status-line-dial" style="font-size:0.82rem;color:var(--text-muted);"></div>
      <button class="btn-secondary" id="btn-unregister" style="margin-top:auto;">Unregister</button>
    </div>

    <!-- CALL SCREEN (incoming ringing / established, shared) -->
    <div class="screen" id="screen-call">
      <div class="call-status" id="call-status">Calling...</div>
      <div class="caller">
        <div class="caller-avatar" id="caller-avatar">?</div>
        <div class="caller-number" id="caller-number">unknown</div>
      </div>

      <div class="call-actions" id="call-actions-incoming" hidden>
        <div class="round-btn-col">
          <button class="round-btn decline" id="btn-decline">&#9587;</button>
          <span class="round-btn-label">Decline</span>
        </div>
        <div class="round-btn-col">
          <button class="round-btn accept" id="btn-answer">&#9742;</button>
          <span class="round-btn-label">Accept</span>
        </div>
      </div>

      <div id="call-actions-established" hidden>
        <div class="keypad" id="in-call-keypad"></div>
        <div class="call-actions">
          <div class="round-btn-col">
            <button class="round-btn decline" id="btn-hangup">&#9587;</button>
            <span class="round-btn-label">Hang up</span>
          </div>
        </div>
      </div>

      <div class="call-actions" id="call-actions-calling">
        <div class="round-btn-col">
          <button class="round-btn decline" id="btn-cancel">&#9587;</button>
          <span class="round-btn-label">Cancel</span>
        </div>
      </div>
    </div>
  </main>

  <audio id="remote-audio" autoplay playsinline></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/jssip@3.10.1/lib-es5/JsSIP.min.js"></script>
<script src="webphone.js"></script>
</body>
</html>
